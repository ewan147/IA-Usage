[package]
name = "clawd-usage"
version = "0.1.0"
description = "Clawd Usage — Claude Code + Cursor token dashboard"
authors = ["you"]
edition = "2021"

[lib]
name = "clawd_usage_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
dirs = "6"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_ProcessStatus"] }
webview2-com = "0.39.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
base64 = "0.23.1"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
